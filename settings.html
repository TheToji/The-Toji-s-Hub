<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TheToji's Hub - Settings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /* Sol Üst Sabit Ana Sayfa / Geri Dönüş Butonu */
        .home-btn {
            position: fixed;
            left: 20px;
            top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            text-decoration: none;
            color: black;
            font-size: 1.2rem;
            border-radius: 4px;
            z-index: 1000;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .home-btn:hover {
            transform: scale(1.05);
            background-color: #d0d0d0;
        }

        /* Sağ Sabit Menü */
        .side-menu {
            position: fixed;
            right: 20px;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .side-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            color: black;
            padding: 10px 15px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            font-weight: bold;
            border-radius: 4px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .side-btn:hover {
            transform: scale(1.05);
            background-color: #d0d0d0;
        }

        /* Ana İçerik Kutusu */
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border: 1px solid #ddd;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.05);
        }

        h2 {
            font-size: 1.2rem;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        .setting-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .setting-group select, .setting-group button {
            padding: 8px 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f9f9f9;
            cursor: pointer;
        }

        .setting-group button:hover {
            background-color: #e0e0e0;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Sol Üst Ana Sayfaya Dönüş Butonu -->
    <a href="index.html" class="home-btn" title="Home">🏠</a>

    <!-- Sağ Sabit Menü -->
    <div class="side-menu">
        <a href="mods.html" class="side-btn">Mods</a>
        <a href="resourcepacks.html" class="side-btn">Resource Packs</a>
        <a href="games.html" class="side-btn">Games</a>
        <a href="fangames.html" class="side-btn">FanGames</a>
        <a href="documents.html" class="side-btn">Documents</a>
        <a href="sources.html" class="side-btn">Sources</a>
        <a href="media.html" class="side-btn">Media</a>
    </div>

    <!-- Ana İçerik Kutusu -->
    <div class="container">
        <h2>Site Settings</h2>

        <!-- Dil Seçimi -->
        <div class="setting-group">
            <label for="languageSelect">Language / Dil:</label>
            <select id="languageSelect">
                <option value="en" selected>English</option>
                <option value="tr">Türkçe</option>
            </select>
        </div>

        <!-- Tema Seçimi -->
        <div class="setting-group">
            <label for="themeSelect">Theme Preference:</label>
            <select id="themeSelect">
                <option value="light" selected>Light Mode</option>
                <option value="dark">Dark Mode (Coming Soon)</option>
            </select>
        </div>

        <footer>
            Created By TheToji | Copyright (c) 2026
        </footer>
    </div>

</body>
</html>
