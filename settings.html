<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TheToji's Hub - Settings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: black;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        body.dark-mode .container {
            background: #1e1e1e;
            border-color: #333;
            color: #e0e0e0;
        }
        body.dark-mode .side-btn, 
        body.dark-mode select {
            background-color: #2d2d2d;
            color: #e0e0e0;
            border-color: #444;
        }

        .side-menu {
            position: fixed;
            right: 20px;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .side-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            color: black;
            padding: 10px 15px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            font-weight: bold;
            border-radius: 4px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .side-btn:hover {
            transform: scale(1.05);
            background-color: #d0d0d0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border: 1px solid #ddd;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.05);
        }

        h2 {
            font-size: 1.2rem;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .setting-group {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select {
            padding: 8px 12px;
            font-size: 1rem;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #fff;
            color: black;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Sağ Sabit Menü -->
    <div class="side-menu">
        <a href="index.html" class="side-btn" data-i18n="mainPage">Main Page</a>
        <a href="mods.html" class="side-btn" data-i18n="mods">Mods</a>
        <a href="resourcepacks.html" class="side-btn" data-i18n="resourcePacks">Resource Packs</a>
        <a href="games.html" class="side-btn" data-i18n="games">Games</a>
        <a href="fangames.html" class="side-btn" data-i18n="fangames">FanGames</a>
        <a href="documents.html" class="side-btn" data-i18n="documents">Documents</a>
        <a href="sources.html" class="side-btn" data-i18n="sources">Sources</a>
        <a href="media.html" class="side-btn" data-i18n="media">Media</a>
    </div>

    <div class="container">
        <h2 data-i18n="settingsTitle">Settings</h2>

        <!-- Tema Seçimi -->
        <div class="setting-group">
            <label data-i18n="themeLabel">Theme:</label>
            <select id="themeSelect">
                <option value="light" data-i18n="lightTheme">Light</option>
                <option value="dark" data-i18n="darkTheme">Dark</option>
            </select>
        </div>

        <!-- Dil Seçimi -->
        <div class="setting-group">
            <label data-i18n="langLabel">Language:</label>
            <select id="languageSelect">
                <option value="en">English</option>
                <option value="tr">Türkçe</option>
            </select>
        </div>

        <footer>
            Created By TheToji | Copyright (c) 2026
        </footer>
    </div>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        const savedLang = localStorage.getItem('lang') || 'en';

        const themeSelect = document.getElementById('themeSelect');
        const langSelect = document.getElementById('languageSelect');

        themeSelect.value = savedTheme;
        langSelect.value = savedLang;

        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
        }

        themeSelect.addEventListener('change', (e) => {
            const selectedTheme = e.target.value;
            localStorage.setItem('theme', selectedTheme);
            if (selectedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        });

        langSelect.addEventListener('change', (e) => {
            localStorage.setItem('lang', e.target.value);
            location.reload();
        });
    </script>
</body>
</html>
