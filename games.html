<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TheToji's Hub - Games</title>
    <style>
        /* Genel Sayfa Düzeni */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: black;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Dark Mode Ayarları */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        body.dark-mode .container {
            background: #1e1e1e;
            border-color: #333;
            color: #e0e0e0;
        }
        body.dark-mode .side-btn, 
        body.dark-mode .page-btn {
            background-color: #2d2d2d;
            color: #e0e0e0;
            border-color: #444;
        }
        body.dark-mode .side-btn:hover, 
        body.dark-mode .page-btn:hover {
            background-color: #3d3d3d;
        }

        /* Sağ Sabit Menü */
        .side-menu {
            position: fixed;
            right: 20px;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .side-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            color: black;
            padding: 10px 15px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            font-weight: bold;
            border-radius: 4px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .side-btn:hover {
            transform: scale(1.05);
            background-color: #d0d0d0;
        }

        /* Ana İçerik Kutusu */
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border: 1px solid #ddd;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.05);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        h2 {
            font-size: 1.2rem;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .project-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .project-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .project-item img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            flex-shrink: 0;
            border-radius: 4px;
        }

        .project-item p {
            margin: 0;
            line-height: 1.4;
        }

        /* Detay Sayfasına Gidiş Butonu */
        .page-btn {
            padding: 6px 12px;
            background-color: #e0e0e0;
            border: 1px solid #aaa;
            text-decoration: none;
            color: black;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
            white-space: nowrap;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .page-btn:hover {
            transform: scale(1.05);
            background-color: #d0d0d0;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Sağ Sabit Menü -->
    <div class="side-menu">
        <a href="index.html" class="side-btn">Main Page</a>
        <a href="mods.html" class="side-btn">Mods</a>
        <a href="resourcepacks.html" class="side-btn">Resource Packs</a>
        <a href="games.html" class="side-btn" style="background-color: #dcdcdc;">Games</a>
        <a href="fangames.html" class="side-btn">FanGames</a>
        <a href="documents.html" class="side-btn">Documents</a>
        <a href="sources.html" class="side-btn">Sources</a>
        <a href="media.html" class="side-btn">Media</a>
    </div>

    <!-- Ana İçerik Kutusu -->
    <div class="container">
        <h2>My Games Collection</h2>

        <!-- Oyun 1 -->
        <div class="project-item">
            <div class="project-left">
                <img src="unknown.jpg" alt="No Icon">
                <p><strong>Adventure Of Boliy:</strong> A custom 2D lane-based game concept featuring unique mechanics.</p>
            </div>
            <a href="boliy.html" class="page-btn">Page</a>
        </div>

        <!-- Oyun 2 -->
        <div class="project-item">
            <div class="project-left">
                <img src="unknown.jpg" alt="No Icon">
                <p><strong>Pixel Of My Adventures:</strong> A challenging 2D puzzle adventure project.</p>
            </div>
            <a href="pixeladventures.html" class="page-btn">Page</a>
        </div>

        <footer>
            Created By TheToji | Copyright (c) 2026
        </footer>
    </div>

    <!-- Tema Kontrol Scripti (Doğru Yerde) -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <script>
    // 1. Tema Kontrolü
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }

    // 2. Dil Sözlüğü
    const translations = {
        en: {
            mainPage: "Main Page",
            mods: "Mods",
            resourcePacks: "Resource Packs",
            games: "Games",
            fangames: "FanGames",
            documents: "Documents",
            sources: "Sources",
            media: "Media",
            settingsTitle: "Settings",
            themeLabel: "Theme:",
            lightTheme: "Light",
            darkTheme: "Dark",
            langLabel: "Language:"
        },
        tr: {
            mainPage: "Ana Sayfa",
            mods: "Modlar",
            resourcePacks: "Kaynak Paketleri",
            games: "Oyunlar",
            fangames: "Fan Yapımı Oyunlar",
            documents: "Belgeler",
            sources: "Kaynaklar",
            media: "Medya",
            settingsTitle: "Ayarlar",
            themeLabel: "Tema:",
            lightTheme: "Açık",
            darkTheme: "Koyu",
            langLabel: "Dil:"
        }
    };

    // 3. Dili Uygula
    const currentLang = localStorage.getItem('lang') || 'en';
    if (currentLang === 'tr') {
        document.querySelectorAll("[data-i18n]").forEach(element => {
            const key = element.getAttribute("data-i18n");
            if (translations.tr[key]) {
                element.innerText = translations.tr[key];
            }
        });
    }
</script>
    
</body>
</html>
