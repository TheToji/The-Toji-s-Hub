<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки - TheToji's Hub 1.0</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #000;
            margin: 0;
            padding: 40px;
        }
        .settings-container {
            max-width: 400px;
            background: #e6e6e6;
            padding: 30px;
            border-radius: 4px;
        }
        h2 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0 0 30px 0;
        }
        li {
            margin-bottom: 8px;
        }
        a {
            text-decoration: none;
            color: #0066cc;
        }
        a:hover {
            text-decoration: underline;
        }
        select {
            padding: 4px 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="settings-container">
        <h2>Языки</h2>
        <ul>
            <li><a href="../../settings.html">En - English</a></li>
            <li><a href="../tr/settings.html">Tr - Türkçe</a></li>
            <li><a href="../es/settings.html">Es - Español</a></li>
            <li><a href="../de/settings.html">De - Deutsch</a></li>
            <li><a href="../fr/settings.html">Fr - Français</a></li>
        </ul>

        <h2>Тема</h2>
        <select id="themeSelect">
            <option value="default">По умолчанию</option>
            <option value="dark">Темная</option>
            <option value="contrast">Высокий контраст</option>
        </select>
        
        <br><br>
        <a href="index.html" class="back-btn">&larr; На главную</a>
    </div>

</body>
</html>

<script>
    // Sayfa yüklendiğinde localStorage'da kayıtlı tema var mı bak ve uygula
    const savedTheme = localStorage.getItem('siteTheme');
    if (savedTheme) {
        document.body.className = savedTheme;
        const themeSelect = document.getElementById('themeSelect');
        if (themeSelect) {
            themeSelect.value = savedTheme;
        }
    }

    // Kullanıcı menüden yeni bir tema seçtiğinde çalışır
    const themeSelect = document.getElementById('themeSelect');
    if (themeSelect) {
        themeSelect.addEventListener('change', function() {
            const selectedTheme = this.value;
            
            // Default seçildiyse sınıfı temizle, diğerlerinde ilgili sınıfı ekle
            if (selectedTheme === 'default') {
                document.body.className = '';
                localStorage.removeItem('siteTheme');
            } else {
                document.body.className = selectedTheme;
                localStorage.setItem('siteTheme', selectedTheme);
            }
        });
    }
</script>
